#
# bitpool: build and test ducklake for DuckDB v1.5.6 on linux_amd64 only.
#
# The bitpool org allows only GitHub-owned actions, so this job runs the steps of the `linux`
# job of duckdb/extension-ci-tools `_extension_distribution.yml@v1.5.6` itself: the same
# builder image, vcpkg commit, make targets and artifact path. The free-disk-space action
# becomes a plain `rm`, and there is no ccache.
#
name: Bitpool linux_amd64 build
on:
  push:
    branches: [bitpool/expire-asof-v156]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux_amd64:
    name: Build and test (linux_amd64, DuckDB v1.5.6)
    runs-on: ubuntu-24.04
    env:
      DUCKDB_VERSION: v1.5.6
      CI_TOOLS_VERSION: v1.5.6
      VCPKG_URL: https://github.com/microsoft/vcpkg.git
      VCPKG_COMMIT: 84bab45d415d22042bd0b9081aea57f362da3f35
      VCPKG_BINARY_SOURCES: clear;http,https://vcpkg-cache.duckdb.org,read
      VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
      VCPKG_TARGET_TRIPLET: x64-linux-release
      VCPKG_HOST_TRIPLET: x64-linux-release
      EXTENSION_NAME: ducklake
      DUCKDB_PLATFORM: linux_amd64
      GEN: ninja
      BUILD_SHELL: 1

    steps:
      - name: Free disk space
        continue-on-error: true
        run: |
          sudo rm -rf /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/powershell /usr/share/swift
          docker images -a -q | xargs -r docker rmi

      - name: Move Docker storage to /mnt
        run: |
          sudo systemctl stop docker
          sudo mkdir -p /mnt/docker-data
          echo '{ "data-root": "/mnt/docker-data" }' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          docker info | grep "Docker Root Dir"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/checkout@v4
        name: Checkout extension-ci-tools
        with:
          path: extension-ci-tools
          ref: ${{ env.CI_TOOLS_VERSION }}
          repository: duckdb/extension-ci-tools
          fetch-depth: 0

      - name: Checkout DuckDB to version
        run: DUCKDB_GIT_VERSION=$DUCKDB_VERSION make set_duckdb_version

      - name: Build Docker image
        run: |
          docker build \
            --build-arg "vcpkg_url=$VCPKG_URL" \
            --build-arg "vcpkg_commit=$VCPKG_COMMIT" \
            --build-arg 'extra_toolchains=;;' \
            -t duckdb/linux_amd64 \
            ./extension-ci-tools/docker/linux_amd64

      - name: Create env file for docker
        run: |
          cat <<-EOF > docker_env.txt
          VCPKG_BINARY_SOURCES=$VCPKG_BINARY_SOURCES
          VCPKG_TARGET_TRIPLET=$VCPKG_TARGET_TRIPLET
          VCPKG_OVERLAY_TRIPLETS=/duckdb_build_dir/extensions-ci-tools/toolchains
          VCPKG_OVERLAY_PORTS=/duckdb_build_dir/extension-ci-tools/vcpkg_ports
          BUILD_SHELL=1
          OPENSSL_ROOT_DIR=/duckdb_build_dir/build/release/vcpkg_installed/$VCPKG_TARGET_TRIPLET
          OPENSSL_DIR=/duckdb_build_dir/build/release/vcpkg_installed/$VCPKG_TARGET_TRIPLET
          OPENSSL_USE_STATIC_LIBS=true
          DUCKDB_PLATFORM=linux_amd64
          DUCKDB_GIT_VERSION=$DUCKDB_VERSION
          ENABLE_EXTENSION_AUTOINSTALL=1
          ENABLE_EXTENSION_AUTOLOADING=1
          EXTENSION_NAME=$EXTENSION_NAME
          LINUX_CI_IN_DOCKER=1
          SUBSET_EXTENSIONS_TESTS=regular
          EOF

      - name: Run configure (outside Docker)
        env:
          DUCKDB_GIT_VERSION: ${{ env.DUCKDB_VERSION }}
          LINUX_CI_IN_DOCKER: 0
        run: make configure_ci

      - name: Run configure (inside Docker)
        run: docker run --env-file=docker_env.txt -v `pwd`:/duckdb_build_dir duckdb/linux_amd64 make configure_ci

      - name: Build extension (inside Docker)
        run: docker run --env-file=docker_env.txt -v `pwd`:/duckdb_build_dir duckdb/linux_amd64 make release

      - name: Test extension (inside Docker)
        run: docker run --env-file=docker_env.txt -v `pwd`:/duckdb_build_dir duckdb/linux_amd64 make test_release

      - name: Test extension (outside Docker)
        env:
          DUCKDB_GIT_VERSION: ${{ env.DUCKDB_VERSION }}
          LINUX_CI_IN_DOCKER: 0
          SUBSET_EXTENSIONS_TESTS: regular
        run: make test_release

      - name: Print the build identity
        run: |
          ./build/release/duckdb -c "SELECT version() AS duckdb, (SELECT extension_version FROM duckdb_extensions() WHERE extension_name = 'ducklake') AS ducklake"
          sha256sum build/release/extension/ducklake/ducklake.duckdb_extension

      - uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: ducklake-v1.5.6-extension-linux_amd64
          path: build/release/extension/ducklake/ducklake.duckdb_extension
